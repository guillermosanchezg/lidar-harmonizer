MODEL_HYPERPARAMETERS:
  num_points: 2900
  feature_vector_size: 1024

TRAINING_HYPERPARAMETERS:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  max_instances: 500
  early_stopping_patience: 25
  early_stopping_delta: 0.01
  triplet_alpha: 0.5   # peso de triplet loss; 0 = CE-only puro (sin mining)

# Semilla global para reproducibilidad de splits y submuestreos.
# El split se genera UNA sola vez y se persiste en ./data/splits/split.csv.
seed: 42

DEVICE_CONFIG:
  device: "cuda"

SELECTED_CLASSES:
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  - 13
  - 14
  - 15
  - 16

CLASS_NAME_MAPPING:
  2:  "turismo"
  3:  "camión rígido"
  4:  "bus"
  5:  "mini bus"
  6:  "caravana"
  7:  "camión con contenedor"
  8:  "camión de obra"
  9:  "camión articulado"
  13: "L3H3"
  14: "hormigonera"
  15: "grúa"
  16: "cabeza tractora"

CONFUSION_MATRIX_CONFIG:
  save_dir: "./matrices"
  model_name: "pointnet"

# ---------------------------------------------------------
# NUEVA SECCIÓN DE AGRUPACIÓN DE CLASES (SUPERCLASES V2X)
# ---------------------------------------------------------
TRAINING_MODE: "superclass"

SUPERCLASS_MAPPING:
  2:  0   # turismo → Passenger Car
  13: 1   # L3H3 → Van
  4:  2   # bus → Bus
  5:  2   # mini bus → Bus
  3:  3   # camión rígido → Rigid Truck
  7:  3   # camión con contenedor → Rigid Truck
  8:  3   # camión de obra → Rigid Truck
  14: 3   # hormigonera → Rigid Truck
  9:  4   # camión articulado → Articulated Truck
  6:  5   # caravana → Other Vehicles
  15: 5   # grúa → Other Vehicles
  16: 5   # cabeza tractora → Other Vehicles

